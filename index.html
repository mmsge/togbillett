<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#080807">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tickets">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Ticket Wallet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080807;
      --surface: #0f0e0d;
      --border:  #2a2825;
      --text:    #f5f0eb;
      --muted:   #6b6560;
      --accent:  #f59e0b;
      --train:   #f59e0b;
      --concert: #e879f9;
      --museum:  #34d399;
      --other:   #94a3b8;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      font-family: Georgia, serif;
      font-size: 1.2rem;
      font-weight: normal;
      letter-spacing: 0.05em;
      color: var(--accent);
      white-space: nowrap;
    }

    #stats {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.5;
    }

    /* ── Main ── */
    main {
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ── Upload area ── */
    .upload-area {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      margin-bottom: 20px;
      transition: border-color 0.2s, background 0.2s;
    }

    .upload-area.drag-over {
      border-color: var(--accent);
      background: rgba(245,158,11,0.05);
    }

    #file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .upload-btn {
      display: inline-block;
      background: var(--accent);
      color: #000;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }

    .upload-btn:active { opacity: 0.75; }

    .upload-btn.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .upload-hint {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Processing spinner ── */
    .processing {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .processing.visible { display: flex; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Loading overlay ── */
    #init-loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    #init-loading .big-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    #init-loading.hidden { display: none; }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .filter-btn:active { opacity: 0.7; }

    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(245,158,11,0.08);
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 2;
    }

    /* ── Ticket card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-top-bar {
      height: 4px;
      flex-shrink: 0;
    }

    .card-body {
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .cat-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
      line-height: 1;
      margin-top: 1px;
    }

    .card-name {
      font-family: Georgia, serif;
      font-size: 0.9rem;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .barcode-badge {
      flex-shrink: 0;
      font-size: 0.62rem;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      color: #000;
      background: var(--accent);
      padding: 2px 5px;
      border-radius: 3px;
      margin-top: 2px;
      letter-spacing: 0.05em;
    }

    /* ── Thumbnail strip ── */
    .thumb-strip {
      display: flex;
      gap: 4px;
      overflow: hidden;
    }

    .thumb {
      flex: 1;
      min-width: 0;
      aspect-ratio: 0.707; /* A4 portrait */
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .thumb.has-barcode::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
    }

    /* ── Card meta row ── */
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--muted);
    }

    /* ── Category select ── */
    .cat-select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      max-width: 120px;
    }

    .cat-select:focus { outline: 1px solid var(--accent); }

    /* ── Card actions ── */
    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-show {
      flex: 1;
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-show:active { opacity: 0.75; }

    .btn-delete {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-delete:active {
      border-color: #ef4444;
      color: #ef4444;
    }

    /* ── Overlay ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,0.92);
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      overflow: hidden;
    }

    #overlay.open { display: flex; }

    .overlay-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 8px;
    }

    .overlay-title {
      font-family: Georgia, serif;
      font-size: 0.9rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      flex-shrink: 0;
    }

    .btn-close:active { color: var(--text); }

    .overlay-image-wrap {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #fff;
      padding: 8px;
    }

    .overlay-image-wrap img {
      max-width: 100%;
      display: block;
      border-radius: 2px;
    }

    .overlay-footer {
      width: 100%;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      flex-shrink: 0;
    }

    .overlay-barcode {
      font-size: 0.68rem;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .overlay-barcode strong {
      color: var(--accent);
      font-weight: normal;
    }

    .overlay-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    .btn-nav:disabled { opacity: 0.3; cursor: default; }
    .btn-nav:not(:disabled):active { border-color: var(--accent); }

    .page-dots {
      flex: 1;
      display: flex;
      gap: 5px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .page-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .page-dot.current { background: var(--accent); }
    .page-dot.has-barcode { box-shadow: 0 0 0 2px var(--accent); }
  </style>
</head>
<body>

<!-- Init loading screen (shown until ZXing WASM is ready) -->
<div id="init-loading">
  <div class="big-spinner"></div>
  <span>Initialising barcode reader…</span>
</div>

<header>
  <h1>🎟 Ticket Wallet</h1>
  <div id="stats"></div>
</header>

<main>
  <!-- Upload -->
  <div class="upload-area" id="upload-area">
    <input type="file" id="file-input" accept=".pdf" multiple>
    <label for="file-input" class="upload-btn disabled" id="upload-btn">📂 Add PDF tickets</label>
    <p class="upload-hint">Pick one or more PDF files · QR codes detected automatically</p>
  </div>

  <!-- Processing indicator -->
  <div class="processing" id="processing">
    <div class="spinner"></div>
    <span id="processing-msg">Processing…</span>
  </div>

  <!-- Filter tabs -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="train">🚂 Train</button>
    <button class="filter-btn" data-cat="concert">🎵 Concert</button>
    <button class="filter-btn" data-cat="museum">🏛 Museum</button>
    <button class="filter-btn" data-cat="other">📌 Other</button>
  </div>

  <!-- Ticket grid -->
  <div class="grid" id="grid"></div>
</main>

<!-- Fullscreen overlay -->
<div id="overlay">
  <div class="overlay-header">
    <span class="overlay-title" id="overlay-title"></span>
    <button class="btn-close" id="btn-close">✕</button>
  </div>
  <div class="overlay-image-wrap" id="overlay-img-wrap">
    <img id="overlay-img" src="" alt="Ticket page">
  </div>
  <div class="overlay-footer">
    <div class="overlay-barcode" id="overlay-barcode"></div>
    <div class="overlay-nav" id="overlay-nav">
      <button class="btn-nav" id="btn-prev">◀ Prev</button>
      <div class="page-dots" id="page-dots"></div>
      <button class="btn-nav" id="btn-next">Next ▶</button>
    </div>
  </div>
</div>

<script src="/lib/pdf.min.js"></script>
<script src="/lib/idb-keyval.min.js"></script>
<script src="/lib/zxing.min.js"></script>
<script>
'use strict';

// ── Config ──────────────────────────────────────────────────────────────────

pdfjsLib.GlobalWorkerOptions.workerSrc = '/lib/pdf.worker.min.js';

const CAT_ICONS  = { train: '🚂', concert: '🎵', museum: '🏛', other: '📌' };
const CAT_COLORS = { train: '#f59e0b', concert: '#e879f9', museum: '#34d399', other: '#94a3b8' };
const CAT_LABELS = { train: 'Train', concert: 'Concert', museum: 'Museum', other: 'Other' };

// ── State ────────────────────────────────────────────────────────────────────

let tickets = [];
let activeFilter = 'all';
let overlayTicket = null;
let overlayPage = 0;
let zxingReader = null;

// ── IndexedDB (idb-keyval) ───────────────────────────────────────────────────

async function loadTickets() {
  tickets = (await idbKeyval.get('tickets')) || [];
}

async function saveTickets() {
  await idbKeyval.set('tickets', tickets);
}

// ── Utility ──────────────────────────────────────────────────────────────────

function guessCategory(filename) {
  const f = filename.toLowerCase();
  if (/train|rail|interrail|db|nsb|billet|tog|vy|sj|g[oö]teborg|oslo|bergen|malm[oö]|k[oö]penhamn/.test(f))
    return 'train';
  if (/concert|ticket|show|festival|event/.test(f))
    return 'concert';
  if (/museum|gallery|attraction|tour/.test(f))
    return 'museum';
  return 'other';
}

function formatDate(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit' }).replace('/', '.');
}

function formatBarcodeLabel(fmt) {
  if (!fmt) return null;
  const map = {
    QR_CODE: 'QR', AZTEC: 'AZTEC', PDF_417: 'PDF417',
    DATA_MATRIX: 'DM', CODE_128: 'C128', CODE_39: 'C39',
    EAN_13: 'EAN13', EAN_8: 'EAN8', UPC_A: 'UPCA',
  };
  return map[fmt] || fmt.replace(/_/g, '');
}

// ── ZXing barcode detection ───────────────────────────────────────────────────

async function detectBarcode(canvas) {
  if (!zxingReader) return { barcode: null, barcodeFormat: null };
  const ctx = canvas.getContext('2d');
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  try {
    const results = await zxingReader.readBarcodesFromImageData(imageData, {
      tryHarder: true,
      formats: [],
    });
    if (!results || results.length === 0) return { barcode: null, barcodeFormat: null };
    return { barcode: results[0].text, barcodeFormat: results[0].format };
  } catch (err) {
    console.warn('ZXing error on page:', err);
    return { barcode: null, barcodeFormat: null };
  }
}

// ── PDF processing ────────────────────────────────────────────────────────────

async function processPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const pages = [];

  for (let i = 1; i <= pdf.numPages; i++) {
    setProcessingMsg(`${file.name} — page ${i}/${pdf.numPages}`);
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 2 });

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');

    await page.render({ canvasContext: ctx, viewport }).promise;

    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    const { barcode, barcodeFormat } = await detectBarcode(canvas);

    pages.push({ dataUrl, barcode, barcodeFormat });
  }

  return pages;
}

// ── Data mutations ────────────────────────────────────────────────────────────

async function addTickets(files) {
  showProcessing(true);
  setFilePickerEnabled(false);

  for (const file of files) {
    try {
      const pages = await processPDF(file);
      const name = file.name.replace(/\.pdf$/i, '').replace(/[-_]+/g, ' ');
      const ticket = {
        id: crypto.randomUUID(),
        name,
        category: guessCategory(file.name),
        addedAt: new Date().toISOString(),
        pages,
      };
      tickets.unshift(ticket);
    } catch (err) {
      console.error('Failed to process', file.name, err);
    }
  }

  await saveTickets();
  showProcessing(false);
  setFilePickerEnabled(true);
  render();
}

async function deleteTicket(id) {
  tickets = tickets.filter(t => t.id !== id);
  await saveTickets();
  render();
}

async function setCategoryForTicket(id, category) {
  const t = tickets.find(t => t.id === id);
  if (t) {
    t.category = category;
    await saveTickets();
    render();
  }
}

// ── UI helpers ────────────────────────────────────────────────────────────────

function showProcessing(visible) {
  document.getElementById('processing').classList.toggle('visible', visible);
}

function setProcessingMsg(msg) {
  document.getElementById('processing-msg').textContent = msg;
}

function setFilePickerEnabled(enabled) {
  document.getElementById('upload-btn').classList.toggle('disabled', !enabled);
}

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  renderStats();
  renderGrid();
}

function renderStats() {
  const total = tickets.length;
  const qrCount = tickets.reduce((n, t) => n + t.pages.filter(p => p.barcode).length, 0);
  document.getElementById('stats').innerHTML =
    `${total} ticket${total !== 1 ? 's' : ''}<br>${qrCount} barcode${qrCount !== 1 ? 's' : ''} found`;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const filtered = activeFilter === 'all' ? tickets : tickets.filter(t => t.category === activeFilter);

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      No tickets yet.<br>Tap <strong>📂 Add PDF tickets</strong> to get started.
    </div>`;
    return;
  }

  grid.innerHTML = '';
  for (const ticket of filtered) {
    grid.appendChild(buildCard(ticket));
  }
}

function buildCard(ticket) {
  const card = document.createElement('div');
  card.className = 'card';

  const color = CAT_COLORS[ticket.category] || CAT_COLORS.other;
  const icon  = CAT_ICONS[ticket.category]  || CAT_ICONS.other;

  // Detect any barcode across pages
  const barcodePages = ticket.pages.filter(p => p.barcode);
  const firstBarcode = barcodePages[0];
  const badgeLabel = firstBarcode ? formatBarcodeLabel(firstBarcode.barcodeFormat) : null;

  // Thumbnail strip (up to 4 pages)
  const thumbPages = ticket.pages.slice(0, 4);
  const thumbsHTML = thumbPages.map((p, i) => `
    <div class="thumb ${p.barcode ? 'has-barcode' : ''}" data-page="${i}" title="${p.barcode ? (formatBarcodeLabel(p.barcodeFormat) + ' code detected') : 'Page ' + (i+1)}">
      <img src="${p.dataUrl}" alt="Page ${i+1}" loading="lazy">
    </div>
  `).join('');

  // Category select
  const catOptions = ['train', 'concert', 'museum', 'other'].map(c =>
    `<option value="${c}" ${ticket.category === c ? 'selected' : ''}>${CAT_ICONS[c]} ${CAT_LABELS[c]}</option>`
  ).join('');

  card.innerHTML = `
    <div class="card-top-bar" style="background:${color}"></div>
    <div class="card-body">
      <div class="card-header">
        <span class="cat-icon">${icon}</span>
        <span class="card-name">${escapeHtml(ticket.name)}</span>
        ${badgeLabel ? `<span class="barcode-badge">${badgeLabel}</span>` : ''}
      </div>
      <div class="thumb-strip">${thumbsHTML}</div>
      <div class="card-meta">
        <select class="cat-select">${catOptions}</select>
        <span>${ticket.pages.length} p · ${formatDate(ticket.addedAt)}</span>
      </div>
      <div class="card-actions">
        <button class="btn-show">Show Ticket</button>
        <button class="btn-delete">✕</button>
      </div>
    </div>
  `;

  // Events
  card.querySelector('.btn-show').addEventListener('click', () => openOverlay(ticket));
  card.querySelector('.btn-delete').addEventListener('click', () => {
    if (confirm(`Delete "${ticket.name}"?`)) deleteTicket(ticket.id);
  });
  card.querySelector('.cat-select').addEventListener('change', e => {
    setCategoryForTicket(ticket.id, e.target.value);
  });
  card.querySelectorAll('.thumb').forEach(thumb => {
    thumb.addEventListener('click', () => {
      openOverlay(ticket, parseInt(thumb.dataset.page, 10));
    });
  });

  return card;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Overlay ───────────────────────────────────────────────────────────────────

function openOverlay(ticket, pageIndex) {
  overlayTicket = ticket;

  // Auto-navigate to first page with barcode if no specific page given
  if (pageIndex === undefined) {
    const firstBarcodePage = ticket.pages.findIndex(p => p.barcode);
    overlayPage = firstBarcodePage >= 0 ? firstBarcodePage : 0;
  } else {
    overlayPage = pageIndex;
  }

  document.getElementById('overlay-title').textContent = ticket.name;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderOverlayPage();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  overlayTicket = null;
}

function renderOverlayPage() {
  if (!overlayTicket) return;
  const page = overlayTicket.pages[overlayPage];
  const total = overlayTicket.pages.length;

  // Image
  const img = document.getElementById('overlay-img');
  img.src = page.dataUrl;
  document.getElementById('overlay-img-wrap').scrollTop = 0;

  // Barcode info
  const barcodeEl = document.getElementById('overlay-barcode');
  if (page.barcode) {
    const fmt = formatBarcodeLabel(page.barcodeFormat);
    barcodeEl.innerHTML = `<strong>${fmt}</strong> · ${escapeHtml(page.barcode)}`;
  } else {
    barcodeEl.textContent = 'No barcode detected on this page';
  }

  // Navigation
  const nav = document.getElementById('overlay-nav');
  if (total <= 1) {
    nav.style.display = 'none';
  } else {
    nav.style.display = 'flex';
    document.getElementById('btn-prev').disabled = overlayPage === 0;
    document.getElementById('btn-next').disabled = overlayPage === total - 1;

    // Page dots
    const dotsEl = document.getElementById('page-dots');
    dotsEl.innerHTML = overlayTicket.pages.map((p, i) => `
      <div class="page-dot ${i === overlayPage ? 'current' : ''} ${p.barcode ? 'has-barcode' : ''}"
           data-i="${i}" title="Page ${i+1}${p.barcode ? ' (' + formatBarcodeLabel(p.barcodeFormat) + ')' : ''}"></div>
    `).join('');

    dotsEl.querySelectorAll('.page-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        overlayPage = parseInt(dot.dataset.i, 10);
        renderOverlayPage();
      });
    });
  }
}

// ── Drag-and-drop ─────────────────────────────────────────────────────────────

function initDragDrop() {
  const area = document.getElementById('upload-area');

  area.addEventListener('dragover', e => {
    e.preventDefault();
    area.classList.add('drag-over');
  });

  area.addEventListener('dragleave', () => area.classList.remove('drag-over'));

  area.addEventListener('drop', e => {
    e.preventDefault();
    area.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.pdf'));
    if (files.length) addTickets(files);
  });
}

// ── Event wiring ──────────────────────────────────────────────────────────────

document.getElementById('file-input').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  if (files.length) addTickets(files);
  e.target.value = ''; // allow re-picking same file
});

document.getElementById('btn-close').addEventListener('click', closeOverlay);

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay') ||
      e.target === document.getElementById('overlay-img-wrap')) {
    closeOverlay();
  }
});

document.getElementById('btn-prev').addEventListener('click', () => {
  if (overlayPage > 0) { overlayPage--; renderOverlayPage(); }
});

document.getElementById('btn-next').addEventListener('click', () => {
  if (overlayTicket && overlayPage < overlayTicket.pages.length - 1) {
    overlayPage++;
    renderOverlayPage();
  }
});

// Filter buttons
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  activeFilter = btn.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (!overlayTicket) return;
  if (e.key === 'Escape') closeOverlay();
  if (e.key === 'ArrowLeft' && overlayPage > 0) { overlayPage--; renderOverlayPage(); }
  if (e.key === 'ArrowRight' && overlayTicket && overlayPage < overlayTicket.pages.length - 1) {
    overlayPage++;
    renderOverlayPage();
  }
});

// ── Boot ──────────────────────────────────────────────────────────────────────

async function boot() {
  // Load stored tickets first
  await loadTickets();
  render();

  // Init ZXing WASM — blocks file picker until ready
  try {
    zxingReader = await ZXingWASM.createReader({
      wasmBinaryPath: '/lib/zxing_reader.wasm',
    });
  } catch (err) {
    console.warn('ZXing WASM failed to init, barcode detection disabled:', err);
  }

  // Hide loading screen and enable picker
  document.getElementById('init-loading').classList.add('hidden');
  setFilePickerEnabled(true);

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW reg failed:', e));
  }

  initDragDrop();
}

boot();
</script>
